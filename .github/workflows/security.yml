name: Security Scan

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'package.json'
      - 'requirements.txt'
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Monday at 09:00 UTC
    - cron: '0 9 * * 1'

jobs:
  # --- Layer 1: Static Analysis (SAST) ---
  sast:
    name: Static Analysis (Bandit + Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit (Python backend)
        run: |
          bandit -r backend/app \
            --severity-level medium \
            -s B101,B603,B404,B324 \
            -f json -o bandit-results.json || true
          # Show summary
          python -c "
          import json
          data = json.load(open('bandit-results.json'))
          results = data.get('results', [])
          high = [r for r in results if r['issue_severity'] == 'HIGH']
          print(f'Bandit: {len(results)} findings ({len(high)} HIGH)')
          if high:
              for h in high:
                  print(f'  CRITICAL: {h[\"test_id\"]} {h[\"filename\"]}:{h[\"line_number\"]}')
              exit(1)
          "

      - name: Install Semgrep
        run: pip install semgrep || python -m pip install semgrep

      - name: Run Semgrep
        continue-on-error: true
        run: |
          semgrep --config .semgrep.yml backend/app/ --json --output semgrep-results.json 2>&1 || true
          if [ -f semgrep-results.json ]; then
            python -c "
          import json
          data = json.load(open('semgrep-results.json'))
          results = data.get('results', [])
          errors = [r for r in results if r.get('extra', {}).get('severity') == 'ERROR']
          print(f'Semgrep: {len(results)} findings ({len(errors)} ERROR)')
          for e in errors:
              print(f'  {e[\"check_id\"]} {e[\"path\"]}:{e[\"start\"][\"line\"]}')
          if errors:
              exit(1)
          "
          else
            echo "Semgrep output file not found — scan may have failed, treating as non-blocking"
          fi

      - name: Upload SAST results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-results
          path: bandit-results.json

  # --- Layer 2: Dependency Audit ---
  deps:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip install -r backend/requirements.txt
          pip-audit --format json --output pip-audit-results.json || true
          python -c "
          import json
          data = json.load(open('pip-audit-results.json'))
          vulns = data.get('dependencies', [])
          critical = [v for v in vulns if v.get('vulns')]
          print(f'pip-audit: {len(critical)} packages with vulnerabilities')
          for v in critical[:5]:
              print(f'  {v[\"name\"]} {v[\"version\"]}: {len(v[\"vulns\"])} CVEs')
          "

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit npm dependencies
        working-directory: frontend
        run: |
          npm install --ignore-scripts
          npm audit --audit-level=high --json > ../npm-audit-results.json 2>/dev/null || true
          node -e "
          const data = JSON.parse(require('fs').readFileSync('../npm-audit-results.json', 'utf8'));
          const total = data.metadata?.vulnerabilities || {};
          console.log('npm audit:', JSON.stringify(total));
          if ((total.critical || 0) + (total.high || 0) > 0) {
            console.log('CRITICAL/HIGH npm vulnerabilities found!');
            process.exit(1);
          } else {
            console.log('No critical/high npm vulnerabilities. Moderate/low are informational.');
          }
          "

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: |
            pip-audit-results.json
            npm-audit-results.json

  # --- Layer 3: Container / filesystem CVE scan (Trivy) ---
  # Dos pasos a proposito, y el orden importa:
  #
  #   1. INVENTARIO: escanea TODO el repo y sube el SARIF a Code Scanning.
  #      No bloquea (exit-code 0). Ningun hallazgo se oculta.
  #   2. GATE: mismo escaneo pero sin el `package-lock.json` de la RAIZ.
  #      Este si bloquea con HIGH/CRITICAL.
  #
  # Por que: el lockfile de la raiz declara `ruflo` (+ better-sqlite3, sql.js,
  # @playwright/test), utillaje local de orquestacion de agentes. Su arbol
  # transitivo (agentic-flow, hono, protobufjs, @grpc/grpc-js, opentelemetry,
  # adm-zip, sharp...) aportaba 111 de los 113 hallazgos, incluida 1 CRITICAL.
  # Nada de eso llega a produccion: el backend se construye desde /backend con
  # backend/Dockerfile y requirements.txt (sin npm), y el frontend desde
  # /frontend con su propio package.json. Un gate de CVEs de produccion que
  # falla por herramientas de desarrollo se vuelve ruido, y un job que siempre
  # esta rojo es un job que nadie mira: exactamente como estos tres llevaban
  # semanas sin ejecutarse sin que nadie se diera cuenta.
  #
  # Los hallazgos de utillaje NO desaparecen: siguen en la pestana Security via
  # el SARIF del paso 1. Si molestan de verdad, se arreglan actualizando ruflo,
  # no relajando el gate del producto.
  trivy:
    name: Trivy CVE Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Trivy — inventario completo (informativo, no bloquea)
        # Los tags de trivy-action van con prefijo "v": "0.28.0" a secas no
        # resuelve y el step fallaba con "Unable to resolve action". Verificado
        # contra la API de GitHub: existe v0.28.0, no 0.28.0. v0.36.0 es la
        # release vigente (2026-04-22).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif

      # Las dos subidas van ANTES del gate a proposito, para que el SARIF llegue
      # a Code Scanning aunque el gate tumbe el job. Llevan `if: always()`
      # ademas, por si algun dia se reordena.
      - name: Upload Trivy SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Upload Trivy artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif

      - name: Trivy — gate sobre lo que se despliega
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          # Lista NEGRA, no blanca, y a proposito: se sigue escaneando todo el
          # repo menos este fichero, asi que cualquier codigo o manifiesto nuevo
          # queda cubierto por defecto (fail-closed) sin tener que acordarse de
          # anadirlo aqui.
          #
          # `./package-lock.json` ancla en la raiz del target. La doc de Trivy
          # (docs/configuration/skipping) es explicita: los patrones siguen la
          # sintaxis doublestar, `./fichero` casa SOLO en la raiz y
          # `**/fichero` casaria a cualquier profundidad. Es decir: esto NO
          # excluye frontend/package-lock.json, que si se despliega.
          skip-files: './package-lock.json'
          format: table

  # --- Layer 4: DAST (weekly only) ---
  dast:
    name: OWASP ZAP API Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: 'https://impuestify.com/openapi.json'
          format: openapi
          cmd_options: '-l WARN'

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
