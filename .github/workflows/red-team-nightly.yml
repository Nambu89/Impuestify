name: Red Team Nightly (Promptfoo)

# Runs the Spanish jailbreak/inject suite against the staging endpoint
# every night at 02:00 UTC and on every PR that touches security code.
# Fails if any assertion regresses.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/app/security/**"
      - "backend/app/agents/tax_agent.py"
      - "backend/app/routers/chat_stream.py"
      - "tests/red-team/**"
      - ".github/workflows/red-team-nightly.yml"

jobs:
  red-team:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PROMPTFOO_TARGET_URL: ${{ secrets.PROMPTFOO_TARGET_URL }}
      PROMPTFOO_AUTH_TOKEN: ${{ secrets.PROMPTFOO_AUTH_TOKEN }}
      # Avoid Promptfoo's cloud sharing
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_UPDATE_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate required secrets
        run: |
          if [ -z "$PROMPTFOO_TARGET_URL" ]; then
            echo "::error::PROMPTFOO_TARGET_URL secret is missing."
            exit 1
          fi
          if [ -z "$PROMPTFOO_AUTH_TOKEN" ]; then
            echo "::error::PROMPTFOO_AUTH_TOKEN secret is missing."
            exit 1
          fi

      - name: Install Promptfoo
        run: npm install -g promptfoo@latest

      - name: Run Spanish red-team suite
        run: |
          promptfoo eval \
            -c tests/red-team/promptfooconfig.yaml \
            --no-cache \
            --output tests/red-team/results.json

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-team-results
          path: tests/red-team/results.json
          retention-days: 30
