name: Red Team Nightly (Promptfoo)

# Lanza la suite espanola de jailbreak/inyeccion contra el endpoint desplegado,
# cada noche a las 02:00 UTC. Falla si alguna asercion regresa.
#
# SIN disparador `pull_request`, a proposito.
#
# Esta suite NO prueba el codigo del PR: promptfoo hace peticiones HTTP a
# `PROMPTFOO_TARGET_URL`, un entorno YA DESPLEGADO (ver el provider en
# tests/red-team/promptfooconfig.yaml). El job no levanta ningun servidor.
#
# Comprobado con relojes: el commit que arreglaba el modelo del clasificador se
# empujo a las 20:54:14 UTC y el run arranco a las 20:54:32 con ese codigo en el
# checkout... y fallo identico, porque medía produccion. Ningun cambio en una
# rama podia ponerlo en verde.
#
# Eso lo convertia en un check permanentemente en rojo que nadie miraba — y asi
# pasaron inadvertidos seis dias en que el chat rechazaba TODAS las preguntas
# (Bug 117) y ocho semanas de un AttributeError en cada peticion (Bug 119).
#
# Queda como monitor nocturno + verificacion a mano DESPUES de desplegar:
#   mergear -> desplegar -> lanzar este workflow -> comprobar
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  red-team:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PROMPTFOO_TARGET_URL: ${{ secrets.PROMPTFOO_TARGET_URL }}
      PROMPTFOO_LOGIN_URL: ${{ secrets.PROMPTFOO_LOGIN_URL }}
      PROMPTFOO_AUTH_EMAIL: ${{ secrets.PROMPTFOO_AUTH_EMAIL }}
      PROMPTFOO_AUTH_PASSWORD: ${{ secrets.PROMPTFOO_AUTH_PASSWORD }}
      PROMPTFOO_BOT_SECRET: ${{ secrets.PROMPTFOO_BOT_SECRET }}
      # Avoid Promptfoo's cloud sharing
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_UPDATE_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # promptfoo@latest exige Node >= 22.22. Con Node 20 el `npm install -g`
          # de mas abajo fallaba y la suite de red-team llevaba noches sin
          # ejecutarse de verdad: el job moria antes del eval.
          node-version: "22"

      - name: Validate required secrets
        run: |
          missing=0
          for var in PROMPTFOO_TARGET_URL PROMPTFOO_LOGIN_URL PROMPTFOO_AUTH_EMAIL PROMPTFOO_AUTH_PASSWORD PROMPTFOO_BOT_SECRET; do
            if [ -z "${!var}" ]; then
              echo "::error::Secret $var is missing."
              missing=1
            fi
          done
          [ $missing -eq 0 ]

      - name: Login to obtain fresh access token
        id: login
        run: |
          # Access tokens expire in 30 min, so we authenticate fresh each run.
          # Uses /auth/login-bot which bypasses Turnstile via X-Bot-Secret header
          # and is restricted server-side to a hardcoded allowlist (qa-redteam).
          response=$(curl -sS -X POST "$PROMPTFOO_LOGIN_URL" \
            -H "Content-Type: application/json" \
            -H "X-Bot-Secret: $PROMPTFOO_BOT_SECRET" \
            -d "{\"email\":\"$PROMPTFOO_AUTH_EMAIL\",\"password\":\"$PROMPTFOO_AUTH_PASSWORD\"}")
          token=$(echo "$response" | jq -r '.tokens.access_token // .access_token // empty')
          if [ -z "$token" ]; then
            echo "::error::Login failed. Response: $response"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "PROMPTFOO_AUTH_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Install Promptfoo
        run: npm install -g promptfoo@latest

      - name: Run Spanish red-team suite
        run: |
          promptfoo eval \
            -c tests/red-team/promptfooconfig.yaml \
            --no-cache \
            --output tests/red-team/results.json

      # Sin esto habia que descargar el artefacto y abrirlo a mano para saber
      # QUE habia fallado. Esa friccion es parte de por que la suite llevaba
      # meses en rojo sin que nadie la mirase: el run decia "failure" y nada mas.
      # Ahora los casos rojos salen en el log y en el resumen del run.
      - name: Report failing cases
        if: failure()
        run: |
          results="tests/red-team/results.json"

          if [ ! -f "$results" ]; then
            echo "No hay $results: el eval murio antes de escribir la salida."
            echo "Mira los pasos anteriores (login, instalacion o red)."
            {
              echo "## Red team: sin resultados"
              echo ""
              echo "El eval no llego a escribir \`$results\`. El fallo esta en un paso anterior."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Estructura real de la salida de promptfoo, verificada contra el
          # artefacto del run 32601663247 (promptfoo 0.122.0):
          #   .results.results[] -> .success
          #                      -> .vars.prompt
          #                      -> .gradingResult.componentResults[] -> .pass, .reason, .assertion.type
          # Ojo: el array esta anidado dos niveles (.results.results), no en la raiz.
          total=$(jq '.results.results | length' "$results")
          failed=$(jq '[.results.results[] | select(.success == false)] | length' "$results")

          echo "Casos en rojo: $failed de $total"
          echo "-----------------------------------------------------------"

          # Log plano: prompt + solo las aserciones que han fallado.
          jq -r '
            .results.results[]
            | select(.success == false)
            | "FAIL: " + ((.vars.prompt // "(sin prompt)") | tostring | gsub("\n"; " "))
              + "\n"
              + ([ (.gradingResult.componentResults // [])[]
                   | select(.pass == false)
                   | "        [" + (.assertion.type // "?") + "] " + ((.reason // "") | tostring | gsub("\n"; " "))
                 ] | join("\n"))
          ' "$results"

          # Resumen del run (pestana Summary), en markdown.
          {
            echo "## Red team: $failed de $total casos en rojo"
            echo ""
            echo "La suite mide el entorno YA DESPLEGADO (\`PROMPTFOO_TARGET_URL\`), no el codigo de esta rama."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          jq -r '
            .results.results[]
            | select(.success == false)
            | "### " + ((.vars.prompt // "(sin prompt)") | tostring | gsub("\n"; " "))
              + "\n"
              + ([ (.gradingResult.componentResults // [])[]
                   | select(.pass == false)
                   | "- `" + (.assertion.type // "?") + "` — " + ((.reason // "") | tostring | gsub("\n"; " "))
                 ] | join("\n"))
              + "\n"
          ' "$results" >> "$GITHUB_STEP_SUMMARY"

          # No enmascaramos nada: el job ya esta en rojo por el paso del eval.
          exit 0

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-team-results
          path: tests/red-team/results.json
          retention-days: 30
