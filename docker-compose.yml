services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: demo-melilla-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Coolify auto-injects Caddy/Traefik labels for TLS
