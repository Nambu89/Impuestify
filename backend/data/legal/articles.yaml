# Artículos canónicos del articulado vigente que el system prompt de
# TaxAgent cita de forma habitual en sus plantillas.
#
# NO contiene la ley completa — solo los artículos referenciados en
# respuestas operativas (texto factura, modelos, pro tips). Cuando una
# respuesta cite un artículo NO listado aquí Y el chunk RAG retrievado
# no lo respalde, el citation verifier marcará el banner ⚠ legítimamente.
#
# Estructura:
#   law:           sigla de la norma (referencia a norms.yaml)
#   article:       número del artículo ("21", "69", etc.)
#   subarticle:    apartado/letra ("Uno.1", "Dos.d", "84.uno.2"); null
#                  si la cita aplica al artículo entero
#   topic:         tag corto para localizar el artículo
#   vigent_from:   ISO 8601 — desde cuándo se cita esta forma del artículo
#   vigent_until:  null si vigente
#
# Para añadir nuevos: editar este YAML + commit con razón
# ("feat(legal): añadir Art. X LEY tras reforma RD Y/AAAA").

