# Catálogo de normas tributarias españolas vigentes.
#
# Fuente de verdad para citation verifier y enricher de links a BOE.
# Mantenible sin tocar código: editar este YAML + commit → CI valida + deploy.
#
# Estructura de cada entrada:
#   sigla:        sigla oficial (LIVA, LIRPF, LGT, etc.)
#   full_id:      forma "Tipo Numero/Año" usada en citas legales
#   name:         nombre completo de la norma
#   norm_type:    ley | rd | real_decreto | rd_legislativo | norma_foral
#                 | decreto_foral
#   vigent_from:  fecha de entrada en vigor (ISO 8601)
#   vigent_until: fecha de derogación (null = vigente)
#   aliases:      otras formas en las que el LLM puede citar la norma
#   boe_id:       identificador oficial BOE (formato BOE-A-NNNN-NNNN). Permite
#                 verificar vigencia contra API BOE Datos Abiertos y construir
#                 link a versión consolidada oficial. Verificable con
#                 `curl -H "Accept: application/xml"
#                  https://www.boe.es/datosabiertos/api/legislacion-consolidada/id/{boe_id}`
#   url_html_consolidada:  URL HTML pública opcional (cache del campo
#                 <url_html_consolidada> que devuelve la API). Si null,
#                 se construye desde boe_id: https://www.boe.es/buscar/act.php?id={boe_id}
#
# IMPORTANTE: cada vez que AEAT publica una reforma legal, se actualiza
# este YAML. Adición + cambios de vigencia se commitean con explicación.

