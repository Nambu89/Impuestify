# Catálogo de normas tributarias españolas vigentes.
#
# Fuente de verdad para citation verifier — sustituye el hardcode previo
# en _FUNDAMENTAL_LAWS_WHITELIST. Mantenible sin tocar código: editar
# este YAML + commit con razón → CI valida + deploy.
#
# Estructura de cada entrada:
#   sigla:        sigla oficial (LIVA, LIRPF, LGT, etc.)
#   full_id:      forma "Tipo Numero/Año" usada en citas legales
#   name:         nombre completo de la norma
#   norm_type:    ley | rd | real_decreto | rd_legislativo | norma_foral
#                 | decreto_foral
#   vigent_from:  fecha de entrada en vigor (ISO 8601)
#   vigent_until: fecha de derogación (null = vigente)
#   aliases:      otras formas en las que el LLM puede citar la norma
#
# IMPORTANTE: cada vez que AEAT publica una reforma legal, se actualiza
# este YAML. Adición + cambios de vigencia se commitean con explicación.

schema_version: 1

norms:
